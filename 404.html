<script>
/* 網址自動修正：IG 私訊或自動回覆工具常把網址後面的空格、標點、中文字一起吃進連結，
   造成 404。這裡把多出來的尾巴去掉，導回正確頁面（保留 ?gift= 等參數）。 */
(function(){
 var raw=location.pathname,path=raw;
 try{path=decodeURIComponent(raw)}catch(e){}
 var m=path.match(/^(.*?\.html?)/i);           /* 有 .html：從 .html 之後全部切掉 */
 if(m){path=m[1]}
 else{path=path.replace(/[\s.。，,、;；:：!！?？)）\]】'"「」『』<>]+$/,'')}  /* 去掉結尾標點與空白 */
 path=path.replace(/\s+/g,'');
 var base='/alien-coach/';
 if(path.indexOf(base)!==0)path=base;           /* 不在本站範圍：回首頁 */
 if(path===raw||encodeURI(path)===raw)return;   /* 沒有可修的地方：顯示下方說明，避免無限轉址 */
 location.replace(path+location.search+location.hash);
})();
</script>
